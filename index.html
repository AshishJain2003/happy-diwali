<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Diwali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Yatra+One&display=swap" rel="stylesheet">
<style>
:root{
  --night:#140a2e;
  --sindoor:#c81e3a;
  --marigold:#f6a21e;
  --diya:#ffd36b;
  --rani:#e8467c;
  --ink:#43081a;
  --scene-text:#fff3dc;
  --card-bg:#fff4e2;
  --card-ink:#3e0a1a;
  --card-head:#b3122f;
  --card-soft:#93424f;
  --body-bg:#140a2e;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --card-bg:#2a0b1b;--card-ink:#ffead0;--card-head:#ff8fa6;--card-soft:#f3a8b8;--body-bg:#0f0822;color-scheme:dark;
  }
}
:root[data-theme="dark"]{--card-bg:#2a0b1b;--card-ink:#ffead0;--card-head:#ff8fa6;--card-soft:#f3a8b8;--body-bg:#0f0822;color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--body-bg);color:var(--scene-text);overflow:hidden;font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse 85% 75% at 50% 50%,rgba(0,0,0,0) 55%,rgba(12,2,14,.5) 100%)}

#top{position:fixed;top:0;left:0;right:0;z-index:4;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 22px) 64px 0;text-align:center}
#caption{margin:0 auto;max-width:24ch;font-style:italic;font-weight:600;font-size:clamp(21px,5.4vw,31px);line-height:1.22;text-shadow:0 1px 2px rgba(20,0,10,.9),0 4px 18px rgba(40,0,30,.8);opacity:0;transform:translateY(-8px);transition:opacity .9s ease,transform .9s ease}
#caption.on{opacity:1;transform:none}

#sound{position:fixed;top:0;right:0;z-index:6;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 0 0}
#bSound{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,211,107,.45);background:rgba(20,10,46,.45);color:var(--diya);display:grid;place-items:center;cursor:pointer;padding:0;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .8s}
#bSound.on{opacity:1}
#bSound svg{width:22px;height:22px}
#bSound:focus-visible{outline:3px solid #fff;outline-offset:2px}

#bottom{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 20px calc(env(safe-area-inset-bottom,0px) + 30px);pointer-events:none;text-align:center}
.msg{display:none;margin:0;opacity:0;transform:translateY(10px);transition:opacity 1.6s ease,transform 1.6s ease}
.msg.on{opacity:1;transform:none}
#message{font-style:italic;font-weight:600;font-size:clamp(30px,8vw,48px);line-height:1.08;color:#fff6e4;text-shadow:0 0 22px rgba(255,150,90,.8),0 2px 4px rgba(40,0,10,.85)}
#hint{font-size:18px;font-style:italic;text-shadow:0 1px 6px rgba(0,0,0,.8)}
#hint.on{opacity:.9}

.pill{position:relative;overflow:hidden;display:none;font-family:'Yatra One','Cormorant Garamond',Georgia,serif;font-size:19px;line-height:1;color:var(--ink);background:linear-gradient(180deg,#ffe8a6 0%,#ffcf5c 55%,#f6a21e 100%);border:0;border-radius:999px;padding:16px 28px 14px;box-shadow:inset 0 0 0 1px rgba(255,240,190,.7),0 8px 28px rgba(246,162,30,.4),0 2px 0 rgba(120,40,0,.35);opacity:0;transform:translateY(12px) scale(.96);transition:opacity .5s ease,transform .5s ease;cursor:pointer;pointer-events:none;touch-action:none;-webkit-user-select:none;user-select:none}
.pill.on{opacity:1;transform:none;pointer-events:auto}
.pill:focus-visible{outline:3px solid #fff;outline-offset:3px}
.pill .fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p,0) * 100%);background:rgba(255,255,255,.6)}
.pill .lbl{position:relative}
.pill.ghost{background:rgba(20,10,46,.55);color:var(--diya);box-shadow:inset 0 0 0 1px rgba(255,211,107,.55);font-size:16px;padding:12px 22px 10px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pill[disabled]{cursor:default;filter:saturate(.6);opacity:.7!important}

#fade{position:fixed;inset:0;z-index:7;background:#0d0412;opacity:0;pointer-events:none;transition:opacity .7s ease}
#fade.on{opacity:1}

#note{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 22px calc(env(safe-area-inset-bottom,0px) + 24px);background:rgba(14,4,16,.55);opacity:0;visibility:hidden;transition:opacity .6s ease,visibility .6s}
#note.on{opacity:1;visibility:visible}
#note .card{width:100%;max-width:400px;max-height:100%;overflow:auto;background:var(--card-bg);color:var(--card-ink);border-radius:6px 6px 22px 22px;border-top:6px solid var(--sindoor);padding:30px 26px 24px;box-shadow:0 24px 70px rgba(0,0,0,.55);transform:translateY(14px) scale(.97);transition:transform .6s ease;-webkit-user-select:text;user-select:text}
#note.on .card{transform:none}
#note h2{font-family:'Yatra One',Georgia,serif;font-weight:400;font-size:30px;line-height:1.1;margin:0 0 16px;color:var(--card-head)}
#note p{font-size:20px;line-height:1.5;margin:0 0 14px;font-weight:500}
#note .sign{font-style:italic;color:var(--card-soft);text-align:right;margin:4px 0 22px}
#note .actions{text-align:center}
#note .pill,#intro .pill{display:inline-block;opacity:1;transform:none;pointer-events:auto}

#intro{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 28px calc(env(safe-area-inset-bottom,0px) + 24px);background:radial-gradient(130% 75% at 50% 108%,rgba(200,30,58,.9) 0%,rgba(90,14,46,.92) 38%,rgba(20,10,46,.97) 78%);transition:opacity 1.2s ease,visibility 1.2s}
#intro.gone{opacity:0;visibility:hidden}
#intro h1{font-family:'Yatra One',Georgia,serif;font-weight:400;font-size:clamp(42px,12vw,74px);line-height:1.04;margin:0 0 14px;max-width:11ch;color:var(--diya);text-shadow:0 0 26px rgba(255,170,60,.45)}
#intro p{font-style:italic;font-size:clamp(19px,5vw,24px);line-height:1.38;margin:0 0 32px;max-width:23ch;color:#ffe8cf}
.diya{position:relative;width:110px;height:100px;margin-bottom:22px}
.diya .halo{position:absolute;left:50%;top:-18px;width:140px;height:140px;margin-left:-70px;border-radius:50%;background:radial-gradient(circle,rgba(255,190,80,.5) 0%,rgba(255,140,40,.14) 45%,rgba(255,120,30,0) 70%);animation:breathe 2.6s ease-in-out infinite}
.diya .flame{position:absolute;left:50%;top:10px;width:22px;height:40px;margin-left:-11px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(circle at 50% 72%,#fff 0%,#ffeaa6 26%,#ffb43a 62%,rgba(255,120,30,0) 100%);transform-origin:50% 100%;animation:flick 1.7s ease-in-out infinite}
.diya .bowl{position:absolute;left:50%;bottom:12px;width:92px;height:36px;margin-left:-46px;background:linear-gradient(180deg,#e3692e,#9a3315);border-radius:6px 6px 50% 50%/6px 6px 100% 100%;box-shadow:inset 0 4px 0 rgba(255,205,130,.45)}
.diya .bowl::after{content:"";position:absolute;left:12px;right:12px;top:12px;height:5px;border-radius:3px;background:repeating-linear-gradient(90deg,#ffd36b 0 6px,transparent 6px 12px);opacity:.75}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-2deg)}30%{transform:scale(.93,1.07) rotate(2deg)}60%{transform:scale(1.05,.95) rotate(-1deg)}}
@keyframes breathe{0%,100%{opacity:.82;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){.diya .flame,.diya .halo{animation:none}#caption,.msg,.pill{transition-duration:.01s}}
</style>
</head>
<body>
<canvas id="c" aria-label="An interactive Diwali scene"></canvas>
<div id="vignette"></div>
<div id="top"><p id="caption" aria-live="polite"></p></div>
<div id="sound"><button id="bSound" type="button" aria-label="Mute sound" aria-pressed="false"></button></div>
<div id="bottom">
  <p id="message" class="msg"></p>
  <p id="hint" class="msg">Tap the sky for more fireworks</p>
  <button class="pill" id="bHold" type="button"><span class="fill"></span><span class="lbl">Hold to draw the rangoli</span></button>
  <button class="pill" id="bNote" type="button"><span class="lbl">Read your note</span></button>
  <button class="pill" id="bUp" type="button"><span class="lbl">Go up to the terrace</span></button>
  <button class="pill ghost" id="bReplay" type="button"><span class="lbl">Watch again</span></button>
</div>
<div id="note" role="dialog" aria-modal="true" aria-labelledby="noteTitle">
  <div class="card">
    <h2 id="noteTitle"></h2>
    <div id="noteBody"></div>
    <p class="sign" id="noteSign"></p>
    <div class="actions"><button class="pill" id="bSpark" type="button"><span class="lbl">Light the sparklers</span></button></div>
  </div>
</div>
<div id="fade"></div>
<div id="intro">
  <div class="diya" aria-hidden="true"><div class="halo"></div><div class="flame"></div><div class="bowl"></div></div>
  <h1 id="introTitle"></h1>
  <p id="introText">I built you a little lane of lights. Turn your sound on and come in.</p>
  <button class="pill" id="bOpen" type="button" disabled><span class="lbl">Lighting the diyas…</span></button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ============ Personalise here ============ */
const CONFIG = {
  her: 'Madam Jii',
  him: 'Ash',
  noteTitle: 'Happy Diwali, Madam Jii',
  note: [
    'I wanted to do something a little different for you this Diwali, so I made you this. It took me way longer than I’ll ever admit.',
    'Thank you for putting up with me, laughing at my terrible jokes, and making ordinary days feel like festivals. I hope this year brings you everything you’ve been wishing for.'
  ],
  signoff: '— Ash',
  finalLine: 'Happy Diwali Manyaaaaa'
};
/* ========================================== */

const $ = id => document.getElementById(id);
const ui = {
  caption:$('caption'), message:$('message'), hint:$('hint'), fade:$('fade'), note:$('note'), intro:$('intro'),
  bHold:$('bHold'), bNote:$('bNote'), bUp:$('bUp'), bReplay:$('bReplay'), bOpen:$('bOpen'), bSpark:$('bSpark'), bSound:$('bSound')
};
$('introTitle').textContent = `Happy Diwali, ${CONFIG.her}`;
$('noteTitle').textContent = CONFIG.noteTitle;
CONFIG.note.forEach(t => { const p = document.createElement('p'); p.textContent = t; $('noteBody').appendChild(p); });
$('noteSign').textContent = CONFIG.signoff;
ui.message.textContent = CONFIG.finalLine;
document.title = `Happy Diwali, ${CONFIG.her}`;

function failIntro(msg){
  $('introText').textContent = msg;
  ui.bOpen.style.display = 'none';
}
if (!window.THREE) { failIntro('The 3D scene couldn’t load. Check your connection, then reload the page.'); return; }

/* ---------------- helpers ---------------- */
const V3 = THREE.Vector3, Col = THREE.Color, TAU = Math.PI * 2;
const rand = (a,b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (x,a,b) => x < a ? a : x > b ? b : x;
const lerp = (a,b,t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- renderer ---------------- */
const canvas = $('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  failIntro('This device couldn’t start the 3D scene. Try opening the link in Chrome or Safari.');
  return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, 1, 0.1, 1500);

/* ---------------- textures ---------------- */
function cv(w,h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function makeGlowTex(){
  const s = 128, c = cv(s,s), g = c.getContext('2d');
  const r = g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(.14,'rgba(255,255,255,.9)');
  r.addColorStop(.32,'rgba(255,255,255,.34)'); r.addColorStop(.62,'rgba(255,255,255,.07)');
  r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0,0,s,s);
  return new THREE.CanvasTexture(c);
}
const glowTex = makeGlowTex();

function makeBrickTex(){
  const S = 512, c = cv(S,S), g = c.getContext('2d');
  g.fillStyle = '#6a3a44'; g.fillRect(0,0,S,S);
  const bw = 128, bh = 64;
  for (let row = 0; row < S/bh; row++){
    const off = row % 2 ? bw/2 : 0;
    for (let x = -bw; x < S + bw; x += bw){
      const l = Math.random();
      g.fillStyle = `rgb(${Math.round(lerp(160,192,l))},${Math.round(lerp(94,120,l))},${Math.round(lerp(98,116,l))})`;
      g.fillRect(x + off + 4, row*bh + 4, bw - 8, bh - 8);
      g.fillStyle = 'rgba(255,240,230,.07)'; g.fillRect(x + off + 4, row*bh + 4, bw - 8, 6);
    }
  }
  for (let i = 0; i < 2600; i++){
    g.fillStyle = `rgba(${Math.random()<.5?'40,10,20':'255,230,220'},${rand(.03,.08)})`;
    g.fillRect(rand(0,S), rand(0,S), 2, 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

function drawDiyaIcon(g,x,y,s){
  g.save(); g.translate(x,y); g.scale(s,s);
  const fl = g.createRadialGradient(0,-18,2,0,-18,30);
  fl.addColorStop(0,'rgba(255,255,230,1)'); fl.addColorStop(.35,'rgba(255,200,90,.9)'); fl.addColorStop(1,'rgba(255,140,40,0)');
  g.fillStyle = fl; g.beginPath(); g.ellipse(0,-20,16,28,0,0,TAU); g.fill();
  g.fillStyle = '#fff6d8'; g.beginPath(); g.ellipse(0,-12,5,11,0,0,TAU); g.fill();
  g.fillStyle = '#f08a2a'; g.beginPath(); g.moveTo(-34,0); g.quadraticCurveTo(0,44,34,0); g.closePath(); g.fill();
  g.fillStyle = '#ffd36b'; g.fillRect(-34,-3,68,5);
  g.restore();
}
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

function makeBannerTex(){
  const W = 1024, H = 380, c = cv(W,H), g = c.getContext('2d');
  const grd = g.createLinearGradient(0,0,0,H); grd.addColorStop(0,'#931030'); grd.addColorStop(1,'#5a0a22');
  g.fillStyle = grd; roundRect(g,0,0,W,H,30); g.fill();
  g.strokeStyle = '#f6c453'; g.lineWidth = 10; roundRect(g,14,14,W-28,H-28,22); g.stroke();
  g.lineWidth = 3; roundRect(g,32,32,W-64,H-64,14); g.stroke();
  g.fillStyle = '#ffd36b';
  for (let x = 60; x < W - 50; x += 28){ g.beginPath(); g.arc(x,48,4,0,TAU); g.fill(); g.beginPath(); g.arc(x,H-48,4,0,TAU); g.fill(); }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = "112px 'Yatra One', Georgia, serif"; g.fillStyle = '#ffd36b';
  g.shadowColor = 'rgba(255,170,60,.75)'; g.shadowBlur = 18;
  g.fillText('Happy Diwali', W/2, H*.52);
  g.shadowBlur = 0;
  drawDiyaIcon(g, 104, H*.56, 1.05); drawDiyaIcon(g, W-104, H*.56, 1.05);
  const t = new THREE.CanvasTexture(c); t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

function makeRangoliTex(){
  const S = 1024, c = cv(S,S), g = c.getContext('2d'); g.translate(S/2,S/2); const R = S/2 - 6;
  const disc = (r,col) => { g.fillStyle = col; g.beginPath(); g.arc(0,0,r,0,TAU); g.fill(); };
  const petals = (n,r0,r1,wid,col,rot=0) => { g.fillStyle = col; for (let i=0;i<n;i++){ g.save(); g.rotate(rot + i*TAU/n); g.beginPath(); g.moveTo(r0,0); g.quadraticCurveTo((r0+r1)/2,(r1-r0)*wid,r1,0); g.quadraticCurveTo((r0+r1)/2,-(r1-r0)*wid,r0,0); g.fill(); g.restore(); } };
  const dots = (n,r,s,col,rot=0) => { g.fillStyle = col; for (let i=0;i<n;i++){ const a = rot + i*TAU/n; g.beginPath(); g.arc(Math.cos(a)*r, Math.sin(a)*r, s, 0, TAU); g.fill(); } };
  petals(24,R*.78,R*.995,.62,'#5a2aa0');
  petals(24,R*.78,R*.93,.42,'#a46ae8');
  disc(R*.82,'#4b1f8a');
  dots(48,R*.80,R*.012,'#ffffff',TAU/96);
  disc(R*.765,'#ffffff');
  disc(R*.745,'#ffc61a');
  petals(16,R*.5,R*.74,.5,'#ff7a1a');
  petals(16,R*.5,R*.66,.3,'#ffd54d');
  petals(16,R*.55,R*.73,.35,'#e8467c',TAU/32);
  disc(R*.53,'#ffffff');
  disc(R*.51,'#d81e3f');
  g.strokeStyle = '#fff6e0'; g.lineWidth = R*.018; g.lineJoin = 'round';
  for (const rot of [0, Math.PI/4]){ g.save(); g.rotate(rot); const s = R*.33; g.strokeRect(-s,-s,2*s,2*s); g.restore(); }
  for (let i=0;i<8;i++){ const a = i*TAU/8; g.beginPath(); g.arc(Math.cos(a)*R*.43, Math.sin(a)*R*.43, R*.045, 0, TAU); g.stroke(); }
  for (let i=0;i<8;i++){ const a = i*TAU/8 + TAU/16; g.save(); g.rotate(a); g.translate(R*.42,0); g.rotate(Math.PI/4); g.fillStyle = '#22a45a'; g.fillRect(-R*.035,-R*.035,R*.07,R*.07); g.restore(); }
  disc(R*.24,'#ffc61a');
  petals(8,R*.07,R*.235,.55,'#ff7a1a');
  petals(8,R*.07,R*.2,.5,'#e8467c',TAU/16);
  disc(R*.075,'#ffffff'); disc(R*.04,'#d81e3f');
  dots(32,R*.255,R*.01,'#ffffff');
  g.globalCompositeOperation = 'source-atop';
  for (let i=0;i<9000;i++){ g.fillStyle = `rgba(${Math.random()<.5?'255,255,255':'0,0,0'},${rand(.04,.1)})`; g.fillRect(rand(-R,R), rand(-R,R), 2, 2); }
  g.globalCompositeOperation = 'source-over';
  const t = new THREE.CanvasTexture(c); t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

function makeNoteTex(){
  const W = 256, H = 180, c = cv(W,H), g = c.getContext('2d');
  g.fillStyle = '#fff6e6'; roundRect(g,4,4,W-8,H-8,10); g.fill();
  g.strokeStyle = 'rgba(160,90,60,.25)'; g.lineWidth = 2; g.beginPath(); g.moveTo(10,H/2); g.lineTo(W-10,H/2); g.stroke();
  g.fillStyle = '#d81e3f'; g.save(); g.translate(W/2, 62); g.scale(1.5,1.5);
  g.beginPath(); g.moveTo(0,10); g.bezierCurveTo(-18,-4,-10,-20,0,-9); g.bezierCurveTo(10,-20,18,-4,0,10); g.fill(); g.restore();
  g.fillStyle = '#5a0a22'; g.font = "30px 'Yatra One', Georgia, serif"; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('For you', W/2, 128);
  return new THREE.CanvasTexture(c);
}

/* ---------------- glow points ---------------- */
const U = { uScale: { value: 800 }, uTex: { value: glowTex } };
const GLOW_VS = `
attribute float aSize; attribute float aAlpha; attribute vec3 aColor;
uniform float uScale; varying vec3 vColor; varying float vAlpha;
void main(){
  vColor = aColor; vAlpha = aAlpha;
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  gl_PointSize = aAlpha <= 0.002 ? 0.0 : clamp(aSize * uScale / max(-mv.z, 0.1), 0.0, 256.0);
  gl_Position = projectionMatrix * mv;
}`;
const GLOW_FS = `
uniform sampler2D uTex; varying vec3 vColor; varying float vAlpha;
void main(){
  float t = texture2D(uTex, gl_PointCoord).a;
  float a = t * vAlpha;
  if (a < 0.004) discard;
  vec3 c = mix(vColor, vec3(1.0), smoothstep(0.55, 1.0, t) * 0.55);
  gl_FragColor = vec4(c, a);
}`;
function glowMaterial(){
  return new THREE.ShaderMaterial({ uniforms: U, vertexShader: GLOW_VS, fragmentShader: GLOW_FS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
}

class GlowLayer {

function makeBunny(){
  const g = new THREE.Group(), w = lam(0xffffff), pk = lam(0xffb6c8);
  const add = (geo, mat, x, y, z, sx=1, sy=1, sz=1) => { const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); m.scale.set(sx,sy,sz); g.add(m); return m; };
  add(new THREE.SphereGeometry(.3, 16, 12), w, 0, .27, 0, 1, .85, 1.15);
  add(new THREE.SphereGeometry(.2, 16, 12), w, 0, .5, .26);
  const ears = [];
  for (const sx of [-1, 1]){
    const e = add(new THREE.SphereGeometry(.07, 10, 8), w, sx*.08, .78, .22, 1, 3.2, .6); e.rotation.z = -sx*.15; ears.push(e);
    const ei = add(new THREE.SphereGeometry(.04, 8, 6), pk, sx*.08, .78, .26, 1, 3, .4); ei.rotation.z = -sx*.15;
    add(new THREE.SphereGeometry(.03, 6, 5), lam(0x222222), sx*.09, .53, .43);
    add(new THREE.SphereGeometry(.07, 8, 6), w, sx*.15, .05, .2, 1, .6, 1.4);
  }
  add(new THREE.SphereGeometry(.03, 6, 5), pk, 0, .48, .46);
  add(new THREE.SphereGeometry(.08, 8, 6), w, 0, .3, -.34);
  scene.add(g);
  return { g, ears, baseY: 0, hop: 0, next: rand(2,5) };
}

function buildPlaza(){
  for (const side of [-1, 1]){
    let zc = -62.3;
    while (zc > -93.9){
      let w = rand(5, 7); if (zc - w + 94 < 3.2) w = zc + 94;
      house({ x: side*13.2, z: zc - w/2, ry: side < 0 ? Math.PI/2 : -Math.PI/2, w, h: rand(8, 11.5), color: nextColor(), multi: Math.random() < .4 });
      zc -= w;
    }
    let xc = 4.9;
    while (xc < 13.1){
      let w = Math.min(rand(4, 5), 13.2 - xc); if (13.2 - xc - w < 2.5) w = 13.2 - xc;
      house({ x: side*(xc + w/2), z: -62.3, ry: Math.PI, w, h: rand(8, 11), color: nextColor(), diyas: false });
      xc += w;
    }
  }
  house({ x: -9.6, z: -94, ry: 0, w: 7.2, h: 10, color: nextColor(), multi: true });
  house({ x: 9.6, z: -94, ry: 0, w: 7.2, h: 9.4, color: nextColor() });
  house({ x: 0, z: -94, ry: 0, w: 12, h: 12, d: 12, color: 0xf26b5b, trim: 0xfff3e0, terrace: true, balcony: true, roofLights: false });

  // canopy of lights
  [[-64.5, 9.4, 9.0], [-80, 9.2, 9.4], [-88, 9.0, 8.8]].forEach(([z, ya, yb], k) => {
    const pts = strand(new V3(-13.2, ya, z), new V3(13.2, yb, z), 2.3, .38, k === 1 ? MULTI : WARM);
    lantern(pts[Math.round(pts.length*.3)], pick([0xff8a1e,0xff4f8f,0xffc93a]), 'star');
    lantern(pts[Math.round(pts.length*.7)], pick([0xc45bff,0xff3b3b,0xff8a1e]), k % 2 ? 'oct' : 'star');
    if (k === 2) lantern(pts[Math.round(pts.length*.5)], 0xffc93a, 'star');
  });
  for (const [x, z] of [[-13.2, -64], [13.2, -64]]) strand(new V3(x, 8.8, z), new V3(0, 9.6, -93.8), 2.4, .4, WARM, .15, .85);
  bunting(new V3(-13.2, 6.8, -91), new V3(13.2, 7.0, -91), 1.2);

  // lamp posts
  for (const [x, z] of [[-11, -66], [11, -66], [-11, -90], [11, -90]]){
    lit.add(G.cyl, M(x, 1.6, z, .08, 3.2, .08), 0x3a2a3a);
    lit.add(G.cyl, M(x, .12, z, .22, .24, .22), 0x3a2a3a);
    emit.add(G.sph1, M(x, 3.45, z, .26, .3, .26), 0xffe2a0);
    lights.add(x, 3.45, z, 0xffc870, 1.3, .7, .12, 1.5);
    pools.add(x, z, 6, 0xffa850, .3);
  }

  // rangoli
  const rMat = new THREE.ShaderMaterial({
    uniforms: { uTex: { value: makeRangoliTex() }, uP: { value: 0 } },
    transparent: true, depthWrite: false,
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform sampler2D uTex; uniform float uP; varying vec2 vUv;
      void main(){
        vec2 c = vUv - 0.5; float d = length(c) * 2.0; float a = atan(c.y, c.x) / 6.2831853 + 0.5;
        float f = 0.78 * d + 0.22 * a;
        vec4 t = texture2D(uTex, vUv);
        float vis = 1.0 - smoothstep(uP - 0.012, uP, f);
        float edge = (1.0 - smoothstep(0.0, 0.045, abs(f - uP))) * step(0.002, uP) * (1.0 - step(1.02, uP));
        vec3 col = t.rgb * 0.95 + vec3(1.0, 0.78, 0.38) * edge * 0.9;
        float alpha = t.a * max(vis, edge * 0.8);
        if (alpha < 0.01) discard;
        gl_FragColor = vec4(col, alpha);
      }`
  });
  rangoli = new THREE.Mesh(new THREE.PlaneGeometry(RR*2, RR*2), rMat);
  rangoli.rotation.x = -Math.PI/2; rangoli.position.set(0, .035, RZ); rangoli.renderOrder = 2; scene.add(rangoli);
  rangoliGlow = new THREE.Mesh(new THREE.PlaneGeometry(11, 11), new THREE.MeshBasicMaterial({ map: glowTex, color: 0xff9a40, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
  rangoliGlow.rotation.x = -Math.PI/2; rangoliGlow.position.set(0, .05, RZ); rangoliGlow.renderOrder = 3; scene.add(rangoliGlow);
  noteMesh = new THREE.Mesh(new THREE.PlaneGeometry(.95, .67), new THREE.MeshBasicMaterial({ map: makeNoteTex(), transparent: true }));
  noteMesh.rotation.set(-Math.PI/2, 0, .25); noteMesh.position.set(0, .09, RZ); noteMesh.scale.setScalar(.0001); noteMesh.renderOrder = 4; scene.add(noteMesh);
  for (let i = 0; i < 16; i++){
    const a = i/16*TAU, p = new V3(Math.cos(a)*3.85, 0, RZ + Math.sin(a)*3.85);
    plazaDiyas.push({ idx: diya(p, 1, 0, false), p, a });
  }
}

/* ---------------- poses ---------------- */
function resetPose(p){
  p.legs.forEach(l => l.rotation.set(0,0,0));
  for (const k of ['N','P']){ p.arms[k].rotation.set(0,0,0); p.arms[k].userData.stick.visible = false; }
  p.head.rotation.set(0,0,0); p.headBase = 0;
}
function setP(p, x, y, z, ry){ p.g.position.set(x, y, z); p.g.rotation.set(0, ry, 0); p.baseY = y; }
function placeCouple(where){
  const { her, him, bunny } = C;
  resetPose(her); resetPose(him);
  const back = () => { her.arms.N.rotation.z = -.25; him.arms.P.rotation.z = .25; };
  if (where === 'street'){
    setP(her, -1.37, 0, -.6, Math.PI); setP(him, -.43, 0, -.6, Math.PI); back();
    bunny.g.position.set(.45, 0, -.1); bunny.g.rotation.y = Math.PI + .5; bunny.baseY = 0;
  } else if (where === 'rangoli'){
    const cx = -.9, z = -71.2;
    setP(her, cx - .47, 0, z, Math.PI); setP(him, cx + .47, 0, z, Math.PI); back();
    bunny.g.position.set(cx + 1.4, 0, z + .3); bunny.g.rotation.y = Math.PI - .3; bunny.baseY = 0;
  } else if (where === 'sparkle'){
    const z = -82.3;
    setP(her, -.5, 0, z, 0); setP(him, .5, 0, z, 0);
    her.arms.P.rotation.z = .25; him.arms.N.rotation.z = -.25;
    her.arms.N.rotation.set(-2.35, 0, -.4); him.arms.P.rotation.set(-2.35, 0, .4);
    her.arms.N.userData.stick.visible = true; him.arms.P.userData.stick.visible = true;

function setHolding(v){
  if (S.stage !== 'rangoli') v = false;
  if (v === S.holding) return;
  S.holding = v;
  Sound.sparkler(v);
  ui.bHold.querySelector('.lbl').textContent = v ? 'Keep holding…' : 'Hold to draw the rangoli';
}
function completeRangoli(){
  setHolding(false);
  S.stage = 'rangoliDone'; S.st = 0; S.noteShown = false;
  rangoli.material.uniforms.uP.value = 1.05;
  hideEl(ui.bHold); Sound.chime();
  caption('Beautiful, just like you', 3600);
}
function updateRangoliDone(dt, T){
  setView('rangoli', T); S.st += dt;
  plazaDiyas.forEach((d, i) => {
    const e = clamp((S.st - .3 - i*.11)/.3, 0, 1);
    if (e > 0 && !d.lit){ d.lit = true; for (let k = 0; k < 10; k++) P.spawn({ x: d.p.x, y: .25, z: d.p.z, vx: rand(-1,1), vy: rand(.5,2), vz: rand(-1,1), c: [1,.8,.4], size: .12, life: .6, drag: 2, grav: 1, fade: .4 }); }
    flames.en[d.idx[0]] = e; flames.en[d.idx[1]] = e;
  });
  rangoliGlow.material.opacity = Math.min(.4, S.st*.2);
  const k = clamp((S.st - 2)/.6, 0, 1); noteMesh.scale.setScalar(Math.max(.0001, easeOut(k)));
  if (S.st > 2.9 && !S.noteShown){ S.noteShown = true; showEl(ui.bNote); }
}
function openNote(){
  hideEl(ui.bNote); hideCaption();
  ui.note.classList.add('on');
  setTimeout(() => ui.bSpark.focus({ preventScroll: true }), 400);
}
function enterSparkle(){
  S.stage = 'sparkle'; S.st = 0; S.sparklers = false; S.upShown = false;
  placeCouple('sparkle');
  setView('sparkle', 0);
}
function updateSparkle(dt, T){
  setView('sparkle', T); S.st += dt;
  if (!S.sparklers && S.st > .9){ S.sparklers = true; Sound.sparkler(true); caption('Brighter together', 4000); }
  if (S.sparklers){
    C.her.g.updateMatrixWorld(true); C.him.g.updateMatrixWorld(true);
    for (const [p, side] of [[C.her, 'N'], [C.him, 'P']]){
      const tip = stickTip(p, side);
      for (let k = 0; k < 8; k++){ const sp = rand(1.2, 3.4), d = rdir(); P.spawn({ x: tip.x, y: tip.y, z: tip.z, vx: d[0]*sp, vy: d[1]*sp + .6, vz: d[2]*sp, c: pick([[1,.92,.62],[1,.76,.36],[1,1,.86]]), size: rand(.07,.12), life: rand(.25,.55), drag: 2.2, grav: 4, fade: .25 }); }
      P.spawn({ x: tip.x, y: tip.y, z: tip.z, c: [1,.85,.5], size: .45, life: .06, fade: .06 });
    }
    Sound.crackle(.55);
  }
  if (S.st > 5.5 && !S.upShown){ S.upShown = true; showEl(ui.bUp); }
}
function enterFinale(){
  S.stage = 'finale'; S.st = 0; S.step = 0; S.sparklers = false; S.tapReady = false; S.nextRandom = 1.6; S.quiet = 0;
  Sound.sparkler(false);
  placeCouple('finale'); setView('finale', 0); S.skyTarget = 1;
  caption('Now look up', 2600);
}
function updateFinale(dt, T){
  setView('finale', T); S.st += dt; const t = S.st;
  if (S.step === 0 && t > 4.2){ S.step = 1; launch(0, 44, FZ, 'heart'); S.quiet = t + 3.2; }
  if (S.step === 1 && t > 8.6){ S.step = 2; writeName(); S.quiet = t + 4.6; }
  if (S.step === 2 && t > 11.6){ S.step = 3; showEl(ui.message, 'block'); }
  if (S.step === 3 && t > 13.6){ S.step = 4; for (let i = 0; i < 6; i++) setTimeout(() => { if (S.stage === 'finale') randomShow(); }, i*170); }
  if (S.step === 4 && t > 15.6){ S.step = 5; S.tapReady = true; showEl(ui.hint, 'block'); showEl(ui.bReplay); }
  S.nextRandom -= dt;
  if (S.nextRandom <= 0 && t > S.quiet && rockets.length < 4){ randomShow(); S.nextRandom = S.step >= 5 ? rand(1.4, 2.6) : rand(.7, 1.3); }
}
function resetWorld(){
  S.rangoli = 0; rangoli.material.uniforms.uP.value = 0; ui.bHold.style.setProperty('--p', 0);
  plazaDiyas.forEach(d => { d.lit = false; flames.en[d.idx[0]] = 0; flames.en[d.idx[1]] = 0; });
  noteMesh.scale.setScalar(.0001); rangoliGlow.material.opacity = 0;
  S.skyMix = 0; S.skyTarget = 0; P.clear(); rockets.length = 0; S.pen = null; S.sparklers = false; S.tapReady = false;
  Sound.sparkler(false);
  ['message','hint'].forEach(k => { ui[k].classList.remove('on'); ui[k].style.display = 'none'; });
}

/* ---------------- events ---------------- */
ui.bOpen.addEventListener('click', () => {
  if (ui.bOpen.disabled) return;
  Sound.init(); if (Sound.ctx && Sound.ctx.state === 'suspended') Sound.ctx.resume();
  ui.intro.classList.add('gone'); ui.bSound.classList.add('on');
  enterStreet();
});
ui.bHold.addEventListener('pointerdown', e => { e.preventDefault(); try { ui.bHold.setPointerCapture(e.pointerId); } catch (_) {} setHolding(true); });
['pointerup','pointercancel','lostpointercapture'].forEach(ev => ui.bHold.addEventListener(ev, () => setHolding(false)));
ui.bHold.addEventListener('contextmenu', e => e.preventDefault());
ui.bHold.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat){ e.preventDefault(); setHolding(true); } });
ui.bHold.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') setHolding(false); });
ui.bHold.addEventListener('blur', () => setHolding(false));
ui.bNote.addEventListener('click', openNote);
ui.bSpark.addEventListener('click', () => { ui.note.classList.remove('on'); fadeTo(enterSparkle); });
ui.bUp.addEventListener('click', () => { hideEl(ui.bUp); hideCaption(); fadeTo(enterFinale); });
ui.bReplay.addEventListener('click', () => { hideEl(ui.bReplay); hideCaption(); fadeTo(() => { resetWorld(); enterStreet(); }); });
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
canvas.addEventListener('pointerdown', e => {
  if (S.stage !== 'finale' || !S.tapReady) return;
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1);
  ray.setFromCamera(ndc, camera);
  const o = ray.ray.origin, d = ray.ray.direction; if (d.z > -1e-3) return;
  const t = (FZ - o.z)/d.z;
  launch(o.x + d.x*t, Math.max(26, Math.min(62, o.y + d.y*t)), FZ + rand(-6, 6), pick(['peony','peony','ring','willow','chrys']));
});

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.fov = camera.aspect < .8 ? 66 : 55; camera.updateProjectionMatrix();
  const db = renderer.getDrawingBufferSize(new THREE.Vector2());
  U.uScale.value = db.y / (2*Math.tan(camera.fov*Math.PI/360));
  if (nameSprite){ const sw = camera.aspect < .8 ? 5.2 : 8.5; nameSprite.scale.set(sw, sw*nameSprite.userData.aspect, 1); }
  nameCache = null;
}
window.addEventListener('resize', resize);

/* ---------------- loop ---------------- */
let last = performance.now(), T = 0;
function animateCharacters(t, dt){
  for (const p of [C.her, C.him]){
    p.head.rotation.z = p.headBase + Math.sin(t*1.1 + p.ph)*.035;
    p.g.position.y = p.baseY + Math.sin(t*2 + p.ph)*.008;
  }
  const b = C.bunny;
  b.next -= dt;
  if (b.next <= 0 && b.hop <= 0){ b.hop = .001; b.next = rand(2.5, 6); }
  if (b.hop > 0){ b.hop += dt*3.2; if (b.hop >= Math.PI) b.hop = 0; }
  b.g.position.y = b.baseY + (b.hop > 0 ? Math.sin(b.hop)*.28 : 0);
  b.ears.forEach((e, i) => { e.rotation.z = (i ? -.15 : .15) + Math.sin(t*3 + i)*.08; });
}
function updateSky(dt){
  S.skyMix += (S.skyTarget - S.skyMix)*(1 - Math.exp(-dt*.9));
  const m = S.skyMix;
  skyU.uTop.value.copy(SKY.eTop).lerp(SKY.fTop, m);
  skyU.uMid.value.copy(SKY.eMid).lerp(SKY.fMid, m);
  skyU.uBot.value.copy(SKY.eBot).lerp(SKY.fBot, m);
  scene.fog.color.copy(SKY.eFog).lerp(SKY.fFog, m);
  hemi.color.copy(SKY.eHemi).lerp(SKY.fHemi, m);
  S.flash *= Math.exp(-dt*5);
  amb.color.copy(ambBase).lerp(S.flashCol, S.flash*.6);
  amb.intensity = .42 + S.flash*.35;
}
function emitAmbient(dt){
  if (S.stage === 'finale' || S.stage === 'loading') return;
  if (Math.random() < dt*7){
    P.spawn({ x: camLook.x + rand(-7, 7), y: rand(.4, 5), z: camLook.z + rand(-6, 8), vx: rand(-.1,.1), vy: rand(.15,.35), vz: rand(-.1,.1), c: [.7,.5,.22], size: rand(.05,.09), life: rand(4,6), drag: 0, fade: 1.5 });
  }
}
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last)/1000); last = now; T += dt;
  switch (S.stage){
    case 'intro': setView('intro', T); break;
    case 'street': updateStreet(dt); break;
    case 'rangoli': updateRangoli(dt, T); break;
    case 'rangoliDone': updateRangoliDone(dt, T); break;
    case 'sparkle': updateSparkle(dt, T); break;
    case 'finale': updateFinale(dt, T); break;
  }
  animateCharacters(T, dt);
  for (const l of lanterns){ l.g.rotation.z = Math.sin(T*.9 + l.ph)*.07; if (l.spin) l.body.rotation.y = T*.6 + l.ph; }
  updateRockets(dt); updatePen(dt); emitAmbient(dt);
  P.update(dt);
  lights.update(T); flames.update(T); city.update(T); stars.update(T);
  updateSky(dt);
  if (snapCam){ camPos.copy(tPos); camLook.copy(tLook); snapCam = false; }
  else { const k = 1 - Math.exp(-dt*(S.stage === 'street' ? 5 : 2.4)); camPos.lerp(tPos, k); camLook.lerp(tLook, k); }
  camera.position.copy(camPos); camera.lookAt(camLook);
  skyGroup.position.copy(camera.position);
  renderer.render(scene, camera);
}

async function init(){
  try {
    await Promise.race([
      Promise.all([document.fonts.load("120px 'Yatra One'"), document.fonts.load("italic 600 80px 'Cormorant Garamond'")]),
      new Promise(r => setTimeout(r, 2500))
    ]);
  } catch (e) {}
  try { buildWorld(); } catch (e) { console.error(e); failIntro('Something went wrong while building the scene. Reload the page to try again.'); return; }
  resize();
  placeCouple('street');
  S.stage = 'intro'; setView('intro', 0); snapCam = true;
  requestAnimationFrame(frame);
  ui.bOpen.disabled = false; ui.bOpen.querySelector('.lbl').textContent = 'Open your surprise';
}
init();
})();
</script>
</body>
</html>
